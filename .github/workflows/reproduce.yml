name: Reproduce controlled quota pilot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-postgresql-mcp:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.5'
      - name: Fresh PostgreSQL, regression and SDK pilot
        shell: powershell
        env:
          PYTHONUTF8: '1'
        run: ./implementation/reproduce.ps1
      - name: Preserve public synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-quota-pilot-evidence
          path: |
            results/
            docs/
            MANIFEST.sha256
          if-no-files-found: warn
