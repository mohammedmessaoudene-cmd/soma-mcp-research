name: Reproduce cooperative SOMA kit
on:
  push:
    branches: [cooperative-kit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-stdlib:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.5'
      - name: Verify manifest and reproduce without a model
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python -B reproduce.py "$env:RUNNER_TEMP/soma-reproduction"
      - name: Preserve reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soma-cooperative-kit-reproduction
          path: |
            ${{ runner.temp }}/soma-reproduction/REPRODUCTION.json
            ${{ runner.temp }}/soma-reproduction/*.stdout
            ${{ runner.temp }}/soma-reproduction/*.stderr
          if-no-files-found: warn
